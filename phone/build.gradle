plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.poyi.watchintervals.phone'
    compileSdk 35
    buildFeatures {
        buildConfig true
        compose true
    }
    defaultConfig {
        applicationId 'com.poyi.watchintervals.phone'
        minSdk 29
        targetSdk 35
        versionCode 22
        versionName '0.25.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = false
            all {
                // The Gradle daemon runs with -Dfile.encoding=UTF-8 (see gradle.properties) while
                // test workers inherit the platform encoding. On a repository path containing
                // non-ASCII characters the mismatch mangles the classpath URL and every test class
                // fails to load with ClassNotFoundException. Pin the worker to UTF-8 as well.
                jvmArgs '-Dfile.encoding=UTF-8'
            }
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
